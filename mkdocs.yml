site_name: Triage IA des tickets et alertes MSP
site_description: Documentation du projet de fin de formation Développeur en intelligence artificielle (Simplon)
site_url: https://timdazayous.github.io/Projet_Simplon_FIN_ETUDES/
repo_url: https://github.com/timdazayous/Projet_Simplon_FIN_ETUDES
repo_name: timdazayous/Projet_Simplon_FIN_ETUDES

theme:
  name: material
  language: fr
  # RGPD : pas de chargement depuis Google Fonts (l'adresse IP du visiteur serait transmise
  # à un tiers) ; le site utilise les polices système du visiteur.
  font: false
  features:
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: fr

nav:
  - Accueil: index.md
  - Note de cadrage: cadrage.md
  - Pilotage:
      - Méthode agile: pilotage.md
      - Sprint 1: sprints/sprint-01.md
      - Sprint 2: sprints/sprint-02.md
  - Veille:
      - Organisation: veille/index.md
      - Sources: veille/sources.md
      - Modèle de synthèse: veille/modele.md
      - "Synthèses":
          - 21 octobre 2026 (lancement): veille/2026-10-21.md
  - Tri des tickets:
      - Conception du tri: conception-tri.md
      - Taxonomie: taxonomie.md
  - Service IA:
      - Service LLM (Groq, Ollama): service-llm.md
  - Incidents:
      - Délai dépassé sur Ollama: incidents/2026-10-10-delai-depasse-ollama.md
  - Sources de données:
      - GLPI (installation et accès): glpi.md
      - Jeux de données publics: donnees/jeux-publics.md
      - Récupération et traduction des jeux publics: donnees/recuperation-traduction.md
      - Spécifications de l'extraction: donnees/specifications-extraction.md
      - Dates de fin de support (endoflife.date): donnees/endoflife.md
      - Avis de sécurité du CERT-FR (API JSON): donnees/certfr.md
      - Problèmes connus de Windows (scraping): donnees/windows-known-issues.md
      - Générateur de tickets synthétiques: generateur.md
  - Documentation: documentation.md
  - Intégration continue: ci.md
  - Décisions:
      - Outil de ticketing: decisions/outil-ticketing.md
      - Générateur de documentation (Zensical): decisions/documentation-zensical.md
