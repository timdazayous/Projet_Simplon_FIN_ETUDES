[project]
name = "projet-simplon-fin-etudes"
version = "0.1.0"
description = "Triage IA des tickets et alertes d'un MSP : classification, suggestion de résolution et apprentissage des corrections"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.28.0",
    "httpx2>=2.13",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "beautifulsoup4>=4.15.0",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7,<10",
]
# Récupération des jeux publics (Issue #29) : absent de la CI et de l'installation de base.
data = [
    "huggingface-hub>=0.30",
    "pyarrow>=18",
    "psutil>=6",
]
# Traduction OPUS-MT sur CPU : dépendances lourdes, groupe séparé.
translate = [
    {include-group = "data"},
    "torch>=2.5",
    "transformers>=4.50",
    "sentencepiece>=0.2",
]

[tool.uv.sources]
# Sur Linux, PyPI fournit torch avec CUDA (plusieurs Go) : on impose la version CPU.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F : erreurs de base, I : tri des imports, B : bugs probables, UP : syntaxe moderne
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing"
